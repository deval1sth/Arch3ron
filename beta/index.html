<script>/* apply the saved page and highlighter before first paint (app.js applyTheme writes this) */
try { var L = (localStorage.getItem('archeron-beta-look') || '').split(' '), R = document.documentElement, N = L[0] === 'night' || (L[0] === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  if (N) { R.setAttribute('data-mode', 'night'); document.querySelector('meta[name=theme-color]').setAttribute('content', '#121735'); }
  if (L[1] && L[1] !== 'lime') R.setAttribute('data-hl', L[1]); } catch (e) {}
/* the bat intro plays on the first open of each day; later opens go straight in */
(function () { try { var d = new Date(), k = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); if (localStorage.getItem('archeron-beta-intro') === k) document.documentElement.classList.add('no-intro'); else localStorage.setItem('archeron-beta-intro', k); } catch (e) {} })();</script>

<script>
/* If the app fails to start (e.g. a half-updated cache), offer a repair instead of a dead screen. Progress lives in localStorage and is never touched. */
setTimeout(function () {
  if (window.ARCHERON_OK) return;
  var d = document.createElement('div');
  d.setAttribute('style', 'position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;padding:24px;background:#f4f6fb;color:#1c2033;font:16px system-ui,sans-serif;text-align:center');
  d.innerHTML = '<div><p style="font-size:20px;margin:0 0 8px">Archeron did not start properly</p><p style="opacity:.7;margin:0 0 18px">Usually a half-finished update. Your progress is safe.</p><button style="font:inherit;font-weight:600;padding:12px 22px;border-radius:99px;border:0;background:#2f55e4;color:#fff">Repair the app</button></div>';
  d.querySelector('button').onclick = function () {
    var jobs = [];
    if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); }));
    if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
    Promise.all(jobs).then(function () { location.reload(); }, function () { location.reload(); });
  };
  document.body.appendChild(d);
}, 7000);
</script>
