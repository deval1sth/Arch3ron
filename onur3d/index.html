/* Onur's room in 3D. Everything except Onur is built here from code: rounded shapes, textures painted on canvases
   (wood, planks, plaster, rug, fabric, paper, the city, the screen), a desk lamp, monitor, LED bias light and a PC
   that glow through a bloom pass. three.js r160 and its add-ons are kept in this folder: nothing loads from the network. */
import * as THREE from 'three';
import { GLTFLoader } from './GLTFLoader.js';
import { RoundedBoxGeometry } from './RoundedBoxGeometry.js';
import { RoomEnvironment } from './RoomEnvironment.js';
import { EffectComposer } from './EffectComposer.js';

const PHONE = matchMedia('(pointer: coarse)').matches;
const R = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
R.setPixelRatio(Math.min(PHONE ? 1.5 : 2, devicePixelRatio)); R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.05;
document.body.prepend(R.domElement);
if (/embed/.test(location.search)) document.getElementById('hud').remove();   /* inside Onur's page, which has its own labels */
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x05060a); scene.fog = new THREE.Fog(0x05060a, 7, 16);
const cam = new THREE.PerspectiveCamera(42, 1, .05, 50);
const pmrem = new THREE.PMREMGenerator(R); scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;   /* soft reflections; each material keeps it faint */

/* ---------- tools ---------- */
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const ANISO = Math.min(8, R.capabilities.getMaxAnisotropy());
function tex(w, h, draw, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = ANISO;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t;
}
const M = o => new THREE.MeshStandardMaterial(Object.assign({ roughness: .8, envMapIntensity: .15 }, o));
const glow = (r, g, b) => new THREE.MeshBasicMaterial({ color: new THREE.Color(r, g, b) });   /* above 1 = it blooms */
function add(geo, mat, x, y, z, o = {}) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.rotation.set(o.rx || 0, o.ry || 0, o.rz || 0);
  m.castShadow = o.cast !== false; m.receiveShadow = o.recv !== false; (o.parent || scene).add(m); return m;
}
const rbox = (w, h, d, r = .01) => new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2 - 1e-4, h / 2 - 1e-4, d / 2 - 1e-4));
const cyl = (rt, rb, h, s = 24) => new THREE.CylinderGeometry(rt, rb, h, s);
const V = (x, y, z) => new THREE.Vector3(x, y, z), UP = V(0, 1, 0);
function rod(a, b, r, mat, parent = scene) {
  const d = b.clone().sub(a), m = new THREE.Mesh(cyl(r, r, d.length(), 12), mat);
  m.position.copy(a).add(b).multiplyScalar(.5); m.quaternion.setFromUnitVectors(UP, d.normalize()); m.castShadow = true; parent.add(m); return m;
}
function scribble(g, x, y, w, col, lw) {   /* a line of handwriting-ish strokes */
  g.strokeStyle = col; g.lineWidth = lw; g.beginPath(); g.moveTo(x, y); let cx = x;
  while (cx < x + w) { const s = 4 + rnd() * 9; g.quadraticCurveTo(cx + s * .5, y - 3 - rnd() * 7, cx + s, y + (rnd() - .5) * 3); cx += s; if (rnd() < .12) { cx += 6 + rnd() * 6; g.moveTo(cx, y); } }
  g.stroke();
}
function grain(g, x, y, w, h, n, dark, light, wav = 3) {   /* wood grain streaks */
  for (let i = 0; i < n; i++) {
    const yy = y + rnd() * h; g.globalAlpha = .05 + rnd() * .12; g.strokeStyle = rnd() < .6 ? dark : light; g.lineWidth = .5 + rnd() * 2;
    g.beginPath(); g.moveTo(x, yy); for (let xx = 0; xx <= w; xx += 12) g.lineTo(x + xx, yy + Math.sin(xx / 80 + i) * wav + Math.sin(xx / 21 + i * 1.7) * 1.1); g.stroke();
  }

}
const soft = tex(64, 64, (g, w) => { const r = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, w, w); });

/* ---------- textures ---------- */
const planks = tex(1024, 1024, (g, w, h) => {

      grain(g, x, r * ph, pw, ph, 18, '#000', '#e8c49a', 2); g.fillStyle = 'rgba(0,0,0,.7)'; g.fillRect(x, r * ph, 2, ph); x += pw;

}, [4, 2]);
const rugT = tex(1024, 768, (g, w, h) => {
  g.fillStyle = '#4a0f15'; g.fillRect(0, 0, w, h);
  const band = (m, c, t) => { g.strokeStyle = c; g.lineWidth = t; g.strokeRect(m, m, w - 2 * m, h - 2 * m); };
  band(28, '#1a0507', 26); band(56, '#c7ad86', 6); band(72, '#1a0507', 10); band(92, '#c7ad86', 3);
  g.strokeStyle = 'rgba(199,173,134,.55)'; g.lineWidth = 3;
  for (let i = -6; i <= 6; i++) { g.beginPath(); g.moveTo(w / 2 + i * 60, 120); g.lineTo(w / 2 + i * 60 + (h - 240) * .5, h - 120); g.stroke(); g.beginPath(); g.moveTo(w / 2 + i * 60, 120); g.lineTo(w / 2 + i * 60 - (h - 240) * .5, h - 120); g.stroke(); }
  g.save(); g.translate(w / 2, h / 2); g.rotate(Math.PI / 4); g.fillStyle = '#2a070b'; g.fillRect(-90, -90, 180, 180); g.strokeStyle = '#c7ad86'; g.lineWidth = 5; g.strokeRect(-70, -70, 140, 140); g.restore();
  for (let i = 0; i < 40000; i++) { g.strokeStyle = rnd() < .5 ? 'rgba(0,0,0,.12)' : 'rgba(255,200,180,.06)'; g.lineWidth = 1; const x = rnd() * w, y = rnd() * h; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rnd() - .5) * 4, y + (rnd() - .5) * 4); g.stroke(); }
});

  g.fillStyle = '#151519'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 6000; i++) { g.fillStyle = `rgba(255,255,255,${rnd() * .03})`; g.fillRect(rnd() * w, rnd() * h, 2, 2); }
  g.fillStyle = '#1d1d23'; g.fillRect(w * .28, 0, w * .44, h);
  g.strokeStyle = '#b3202c'; g.lineWidth = 3; g.setLineDash([9, 6]);
  for (const x of [w * .28, w * .72]) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
  for (let y = -h; y < 2 * h; y += 64) { g.beginPath(); g.moveTo(w * .28, y); g.lineTo(w * .72, y + 110); g.stroke(); g.beginPath(); g.moveTo(w * .72, y); g.lineTo(w * .28, y + 110); g.stroke(); }
});
const spine = tex(128, 256, (g, w, h) => {
  g.fillStyle = '#ddd'; g.fillRect(0, 0, w, h); g.fillStyle = '#999'; g.fillRect(0, 18, w, 8); g.fillRect(0, h - 26, w, 8);
  g.fillStyle = '#fff'; g.fillRect(w * .3, 60, w * .4, 110); g.fillStyle = '#777'; for (let y = 70; y < 160; y += 14) g.fillRect(w * .38, y, w * .24, 5);
});
const paper = tex(512, 700, (g, w, h) => {
  g.fillStyle = '#efe9da'; g.fillRect(0, 0, w, h); g.strokeStyle = '#9fb4d8'; g.lineWidth = 2;
  for (let y = 70; y < h; y += 26) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  g.strokeStyle = '#d98a8a'; g.beginPath(); g.moveTo(60, 0); g.lineTo(60, h); g.stroke();
  for (let y = 92; y < h * .78; y += 26) scribble(g, 70, y - 6, 300 + rnd() * 130, '#1f2a55', 2);

});

  const s = g.createLinearGradient(0, 0, 0, h); s.addColorStop(0, '#04061a'); s.addColorStop(.55, '#151a4a'); s.addColorStop(.8, '#3a1d4a'); g.fillStyle = s; g.fillRect(0, 0, w, h);

add(new THREE.BoxGeometry(.1, 2.7, 6), wallM, -2.25, 1.35, .8, { cast: false });

add(new THREE.PlaneGeometry(6, 6), M({ color: 0x0c0d12 }), .4, 2.7, .8, { rx: Math.PI / 2, cast: false });

add(new THREE.PlaneGeometry(1.4, 1.5), new THREE.MeshBasicMaterial({ map: city, color: new THREE.Color(1.15, 1.15, 1.25), fog: false }), 1.55, 1.65, -1.36, { cast: false });
const frameM = M({ color: 0x1b1d26, roughness: .45, envMapIntensity: .4 });

  document.getElementById('load').remove();
}, undefined, e => { document.getElementById('load').textContent = 'Could not load Onur: ' + e.message; });

/* ---------- camera: drag to orbit, wheel to zoom, never through the walls ---------- */
let yaw = .55, pitch = .18, dist = 2.6, drag = null;
const target = V(.15, .85, -.42);
addEventListener('pointerdown', e => { if (e.isPrimary) drag = [e.clientX, e.clientY, yaw, pitch]; });
addEventListener('pointermove', e => { if (!drag || !e.isPrimary) return; yaw = Math.max(-.2, Math.min(1.3, drag[2] - (e.clientX - drag[0]) / 300)); pitch = Math.max(.02, Math.min(.6, drag[3] + (e.clientY - drag[1]) / 400)); });
addEventListener('pointerup', () => drag = null);
addEventListener('wheel', e => { dist = Math.max(1.5, Math.min(3.4, dist + e.deltaY * .002)); }, { passive: true });

const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: PHONE ? 0 : 4 });
const composer = new EffectComposer(R, rt); composer.addPass(new RenderPass(scene, cam));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), .45, .45, .92); composer.addPass(bloom); composer.addPass(new OutputPass());
function resize() { const w = innerWidth, h = innerHeight; R.setSize(w, h, false); composer.setPixelRatio(R.getPixelRatio()); composer.setSize(w, h); cam.aspect = w / h; cam.fov = w < h ? 58 : 42; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const still = /still/.test(location.search);   /* Runo's PC reports reduced motion, which froze everything before; ?still stops it */
let scrAt = -1e9, ckAt = -1e9;
function frame(t) {
  const now = Date.now();
  cam.position.set(target.x + Math.sin(yaw) * dist * Math.cos(pitch), target.y + Math.sin(pitch) * dist, target.z + Math.cos(yaw) * dist * Math.cos(pitch)); cam.lookAt(target);
  if (now - scrAt > 250) { drawScreen(now); scrAt = now; }
  if (now - ckAt > 1000) { drawClock(); ckAt = now; const d = new Date(now); hS.rotation.z = -d.getSeconds() / 60 * Math.PI * 2; hM.rotation.z = -(d.getMinutes() + d.getSeconds() / 60) / 60 * Math.PI * 2; hH.rotation.z = -((d.getHours() % 12) + d.getMinutes() / 60) / 12 * Math.PI * 2; }
  if (!still) {
    const s = Math.sin(t / 900); scr.intensity = 1.6 + s * .15; for (const m of eyeGlow) m.emissiveIntensity = .8 + .25 * Math.sin(t / 700);
    for (const sp of steam) { const k = (t / 3200 + sp.userData.o) % 1; sp.position.set(.72 + Math.sin(k * 6 + sp.userData.o * 9) * .015, DT + .1 + k * .2, -.62); sp.scale.setScalar(.03 + k * .07); sp.material.opacity = Math.sin(k * Math.PI) * .16; }
    for (let i = 0; i < dustN; i++) { const d = dust0[i]; dustP[i * 3] = d[0] + Math.sin(t / 4000 + d[3]) * .04; dustP[i * 3 + 1] = d[1] + Math.sin(t / 5200 + d[3] * 2) * .05; dustP[i * 3 + 2] = d[2] + Math.cos(t / 4600 + d[3]) * .04; }
    dustG.attributes.position.needsUpdate = true;
    if (mixer) mixer.update(Math.min(.1, (t - last) / 1000));
  }
  last = t; composer.render(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
